<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>CONO MCP Harness — Visualizador 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: monospace; color: #0ff; }
    #hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); padding: 10px 14px; border: 1px solid #0ff; }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>CONO / MNHI 3.0 — 3D Client (Desacoplado)</strong></div>
    <div id="status">Aguardando snapshot JSON do WorldEngine...</div>
  </div>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161922);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 9, 11);
    camera.lookAt(6, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 15, 10);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 8),
      new THREE.MeshStandardMaterial({ color: 0x2a2f3d })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(6, 0, 3);
    scene.add(floor);

    window.renderWorldSnapshot = (snapshot) => {
      document.getElementById("status").textContent =
        `Tick: ${snapshot.tick} | Pos: (${snapshot.agent.x}, ${snapshot.agent.y}) | Segurando: ${snapshot.agent.holding || "Nada"}`;
    };

    // Preview estatico de demonstracao (Sala 01 + Cozinha)
    const addBox = (x, z, color, h = 1.2) => {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, h, 0.9),
        new THREE.MeshStandardMaterial({ color })
      );
      m.position.set(x, h / 2, z);
      scene.add(m);
    };
    addBox(2, 2, 0x3b82f6, 1.3); // NPC (Pessoa)
    addBox(6, 3, 0x8b4513, 1.5); // Porta
    addBox(10, 2, 0x9ca3af, 1.8); // Geladeira
    addBox(4, 3, 0x00ffff, 1.0); // Agente Robo

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
